name: Build & Release APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Prepare APK files
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/chalgima-v1.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chalgima-release-apk
          path: build/app/outputs/flutter-apk/chalgima-v1.0.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: "Chalg'ima Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}"
          body: |
            ## 📱 Chalg'ima — O'quv kundaligi va takrorlash ilovasi
            
            Ushbu versiyada mavjud imkoniyatlar:
            - 🧠 **Spaced Repetition (SuperMemo SM-2)** algoritmi
            - ⏱ **Pomodoro taymeri** (25 daqiqa dars / 5 daqiqa tanaffus)
            - 🚫 **Chalg'ituvchi ilovalar monitoringi**
            - 🔔 **Kundalik eslatmalar va bildirishnomalar**
            - 📊 **Statistika va yutuqlar** (Streak, XP, Darajalar)
            - 🌐 **100% Offline va to'liq o'zbek tilidagi qulay interfeys**
            
            Ilovani yuklab olish uchun quyidagi `chalgima-v1.0.0.apk` faylini tanlang.
          files: |
            build/app/outputs/flutter-apk/chalgima-v1.0.0.apk
            build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
